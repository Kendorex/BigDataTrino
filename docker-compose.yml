name: bigdata-trino-lab4

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lab_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lab_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: lab
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/checks:/checks:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "lab", "--password", "lab", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  trino:
    image: trinodb/trino:477
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./sql:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  etl:
    build: ./app
    environment:
      PG_HOST: postgres
      PG_DATABASE: lab_db
      PG_USER: postgres
      PG_PASSWORD: postgres
      CH_URL: http://clickhouse:8123
      CH_USER: lab
      CH_PASSWORD: lab
      TRINO_HOST: trino
    volumes:
      - ./data:/data:ro
      - ./sql:/sql:ro
      - ./app:/app:ro
    depends_on:
      trino:
        condition: service_healthy
    command: ["all"]

volumes:
  postgres_data:
  clickhouse_data:
